name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, data integrity, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Tests
        run: python -m pytest backend/tests -q
      - name: Committed database matches the committed raw data
        run: python scripts/verify_db.py
      - name: Generated TypeScript types are current
        run: python scripts/gen_ts_types.py --check
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes the strict TypeScript check)
        run: npm run build
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start both containers
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the public port
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/api/v1/meta | grep -q '"data_version"'
          curl -fsS "http://localhost:8080/api/v1/forecast?delivery_date=2026-01-28" | grep -q '"points"'
          curl -fsS http://localhost:8080/ | grep -q 'WindWise'
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fsS -D - -o /dev/null http://localhost:8080/api/v1/meta | grep -qi 'x-request-id'
      - name: Logs (only if something failed)
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down