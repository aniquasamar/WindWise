server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API is a separate container. The browser only ever sees this one origin.
    # The API sets its own security headers, so none are added here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # set, never appended: a client cannot spoof it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Built assets have content hashes in their names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        expires -1;                      # always revalidate the page itself
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}